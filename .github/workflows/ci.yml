name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Non-functional CI placeholders: the build gate only needs the public
      # variables, and no real secret ever belongs in this file.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-value-000000
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: gitleaks.toml

      - name: Forbidden content scan
        run: npm run scan:deny-list

      - name: Palette scan
        run: npm run scan:colors

      - name: Dependency audit
        run: npm run audit

      # Best-effort security sweep. Every command here also gates elsewhere, so
      # a missing tool (gitleaks is provided by the action above, not always on
      # the PATH) must never turn into a red build.
      - name: Security sweep
        continue-on-error: true
        run: |
          npm run scan:deny-list
          npm run scan:colors
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --no-banner --redact --config gitleaks.toml
          else
            echo "gitleaks binary not on PATH; the 'Secret scan' action above is the authoritative secret scan."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Best-effort Lighthouse pass over the public profile lock screen — the one
      # page an unauthenticated visitor can always reach, and DB-free so it needs
      # no Supabase project. Kept non-blocking: a slow CI runner or an
      # unavailable Chrome must not fail the pipeline.
      - name: Lighthouse (lock screen)
        continue-on-error: true
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/login; then break; fi
            sleep 2
          done
          npx --yes lighthouse http://localhost:3000/p/lock \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json --output-path=lighthouse-lock.json || true
          kill "$SERVER_PID" 2>/dev/null || true
          node -e "const r=require('./lighthouse-lock.json');console.log('Lighthouse scores:',Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round((v.score??0)*100)])))" || true

